openapi: 3.1.0
info:
  title: Api
  version: 1.0.0
  description: Chariot Financial Solutions case management API
servers:
  - url: /api
tags:
  - name: health
  - name: auth
  - name: dashboard
  - name: clients
  - name: cases
  - name: tasks
  - name: lenders
  - name: communications
  - name: search
  - name: places
  - name: assistant
paths:
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/LoginInput"}
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AuthUser"}
        "401":
          description: Invalid credentials
  /auth/staff-profiles:
    get:
      operationId: listStaffProfiles
      tags: [auth]
      responses:
        "200":
          description: Staff profiles for the PIN-login picker
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/StaffProfile"}}
  /auth/login/pin:
    post:
      operationId: pinLogin
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PinLoginInput"}
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AuthUser"}
        "401":
          description: Invalid PIN
        "423":
          description: Account temporarily locked after repeated failed PIN attempts
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      responses:
        "204":
          description: Signed out
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AuthUser"}
        "401":
          description: Not signed in
  /auth/activate:
    post:
      operationId: activatePortal
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PortalActivationInput"}
      responses:
        "200":
          description: Portal account activated
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AuthUser"}
        "400":
          description: Invalid, expired, or used token
  /auth/password/forgot:
    post:
      operationId: forgotPassword
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ForgotPasswordInput"}
      responses:
        "204":
          description: If an account exists for that email, a reset link was sent
  /auth/password/reset:
    post:
      operationId: resetPassword
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ResetPasswordInput"}
      responses:
        "204":
          description: Password reset
        "400":
          description: Invalid, expired, or used token
  /auth/password/change:
    post:
      operationId: changePassword
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ChangePasswordInput"}
      responses:
        "204":
          description: Password changed
        "401":
          description: Not signed in
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HealthStatus"}
  /portal/cases:
    get:
      operationId: listPortalCases
      tags: [cases]
      responses:
        "200":
          description: Current client's cases (no fee or internal figures) with anything waiting for their approval
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/PortalCase"}}
  /portal/approvals/{id}/respond:
    post:
      operationId: respondPortalApproval
      tags: [portal]
      description: The signed-in client approves, or asks to discuss, advice or submission details sent to them.
      parameters:
        - {$ref: "#/components/parameters/Id"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PortalApprovalInput"}
      responses:
        "200":
          description: Recorded
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ClientApproval"}
        "409":
          description: Already answered or expired
  /approvals/{token}:
    post:
      operationId: respondApprovalByToken
      tags: [portal]
      description: One-click answer from the email link. No session; the token is the credential and can be used once.
      parameters:
        - {name: token, in: path, required: true, schema: {type: string, minLength: 32, maxLength: 200}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PublicApprovalInput"}
      responses:
        "200":
          description: Recorded (or already recorded)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PublicApprovalResult"}
        "404":
          description: Unknown or expired link
  /portal/documents:
    get:
      operationId: listPortalDocuments
      tags: [clients]
      responses:
        "200":
          description: Current client's documents
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/Document"}}
  /portal/properties:
    get:
      operationId: listPortalProperties
      tags: [clients]
      responses:
        "200":
          description: Properties linked to the current client
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/Property"}}
  /portal/properties/{id}:
    patch:
      operationId: updatePortalProperty
      tags: [clients]
      parameters:
        - {$ref: "#/components/parameters/Id"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PortalPropertyInput"}
      responses:
        "200":
          description: Updated client property
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Property"}
        "404":
          description: Property not found for the current client
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      responses:
        "200":
          description: Operational summary
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Dashboard"}
  /activities:
    get:
      operationId: listActivities
      tags: [dashboard]
      parameters:
        - name: page
          in: query
          schema: {type: integer, minimum: 1, default: 1}
        - name: pageSize
          in: query
          schema: {type: integer, minimum: 1, maximum: 25, default: 25}
        - name: propertyId
          in: query
          schema: {type: integer}
      responses:
        "200":
          description: Paginated activity feed
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ActivityPage"}
  /search:
    get:
      operationId: globalSearch
      tags: [search]
      description: |
        Site-wide search across every record type the signed-in staff user can see.
        Every whitespace-separated term must match somewhere in a record (any text,
        number or date field, cast to text), so "smith bridging" finds the case whose
        client is Smith and whose matter type is bridging. Results come back grouped
        by record type, each group capped at `limit` and carrying its total match count.
      parameters:
        - name: q
          in: query
          required: true
          schema: {type: string, minLength: 2, maxLength: 200}
        - name: types
          in: query
          required: false
          description: Comma-separated subset of record types to search; omit for all
          schema: {type: string, maxLength: 200}
        - name: limit
          in: query
          required: false
          description: Maximum hits per record type
          schema: {type: integer, minimum: 1, maximum: 50}
      responses:
        "200":
          description: Matching records grouped by type
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GlobalSearchResults"}
        "400":
          description: Query too short or invalid
  /staff:
    get:
      operationId: listStaff
      tags: [auth]
      responses:
        "200":
          description: Active staff users
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/StaffUser"}}
  /clients:
    get:
      operationId: listClients
      tags: [clients]
      parameters:
        - name: lifecycle
          in: query
          required: false
          description: Filter by lifecycle; "open" = enquiry + onboarding + active, "closed" = declined + lost.
          schema: {type: string, enum: [enquiry, onboarding, active, declined, lost, open, closed]}
      responses:
        "200":
          description: Clients
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Client"}
    post:
      operationId: createClient
      tags: [clients]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ClientInput"}
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Client"}
  /clients/extract:
    post:
      operationId: extractClientEnquiry
      tags: [clients]
      description: Read a pasted enquiry email and suggest client, property and enquiry fields plus possible existing-client matches. Nothing is written.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ExtractEnquiryInput"}
      responses:
        "200":
          description: Suggested fields and matches
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ExtractEnquiryOutput"}
  /clients/matches:
    post:
      operationId: findClientMatches
      tags: [clients]
      description: Possible existing clients for the given contact details (duplicate check before creating an enquiry).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ClientMatchQuery"}
      responses:
        "200":
          description: Matches
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ClientMatchList"}
  /clients/inbound:
    post:
      operationId: inboundClientEnquiry
      tags: [clients]
      description: Forward-in webhook. Authenticated with the x-enquiry-inbound-secret header, not a session.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/InboundEnquiryInput"}
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema: {$ref: "#/components/schemas/InboundEnquiryOutput"}
        "401":
          description: Bad secret
        "503":
          description: Inbound enquiries are not configured
  /clients/{id}/accept:
    post:
      operationId: acceptClientEnquiry
      tags: [clients]
      description: Accept an enquiry - sends the welcome/portal email and creates the advanced-information tasks. Re-issues the welcome email when the previous delivery failed.
      parameters:
        - {$ref: "#/components/parameters/Id"}
      responses:
        "200":
          description: Accepted client
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ClientDetail"}
        "409":
          description: Client is not at the enquiry stage
  /clients/{id}/decline:
    post:
      operationId: declineClientEnquiry
      tags: [clients]
      parameters:
        - {$ref: "#/components/parameters/Id"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DeclineClientInput"}
      responses:
        "200":
          description: Closed client
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ClientDetail"}
        "409":
          description: Client cannot be closed from its current lifecycle
  /clients/{id}/reopen:
    post:
      operationId: reopenClientEnquiry
      tags: [clients]
      parameters:
        - {$ref: "#/components/parameters/Id"}
      responses:
        "200":
          description: Reopened client
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ClientDetail"}
        "409":
          description: Client is not closed
  /clients/{id}/repeat-enquiry:
    post:
      operationId: recordRepeatEnquiry
      tags: [clients]
      description: A new enquiry from an existing client - stores the email, creates the property if one was found and tasks the case default assignee.
      parameters:
        - {$ref: "#/components/parameters/Id"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RepeatEnquiryInput"}
      responses:
        "200":
          description: Updated client
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RepeatEnquiryOutput"}
  /clients/bulk:
    post:
      operationId: bulkUpdateClients
      tags: [clients]
      description: Reassign several clients at once.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/BulkClientUpdate"}
      responses:
        "200":
          description: Updated clients
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Client"}
  /clients/{id}/timeline:
    get:
      operationId: getClientTimeline
      tags: [clients]
      description: Everything that happened on this relationship, newest first - activities, logged interactions, tasks, documents, cases and portal emails.
      parameters:
        - {$ref: "#/components/parameters/Id"}
      responses:
        "200":
          description: Timeline
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/ClientTimelineItem"}
  /clients/{id}/interactions:
    get:
      operationId: listClientInteractions
      tags: [clients]
      parameters:
        - {$ref: "#/components/parameters/Id"}
      responses:
        "200":
          description: Logged interactions, newest first
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/ClientInteraction"}
    post:
      operationId: createClientInteraction
      tags: [clients]
      description: Log a call, email, meeting or note. Updates the client's last-contacted time and, when given, the next follow-up date.
      parameters:
        - {$ref: "#/components/parameters/Id"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ClientInteractionInput"}
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ClientInteraction"}
  /clients/{id}/interactions/{interactionId}:
    patch:
      operationId: updateClientInteraction
      tags: [clients]
      parameters:
        - {$ref: "#/components/parameters/Id"}
        - {name: interactionId, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ClientInteractionUpdate"}
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ClientInteraction"}
        "403":
          description: Only the author or an admin can edit an interaction
    delete:
      operationId: deleteClientInteraction
      tags: [clients]
      parameters:
        - {$ref: "#/components/parameters/Id"}
        - {name: interactionId, in: path, required: true, schema: {type: integer}}
      responses:
        "204":
          description: Deleted
        "403":
          description: Only the author or an admin can delete an interaction
  /companies-house/search:
    get:
      operationId: searchCompaniesHouse
      tags: [clients]
      parameters:
        - name: q
          in: query
          required: true
          schema: {type: string, minLength: 1}
      responses:
        "200":
          description: Matching companies from Companies House
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompaniesHouseSearchResults"
        "503":
          description: Companies House search is not configured
  /places/autocomplete:
    get:
      operationId: autocompletePlaces
      tags: [places]
      parameters:
        - name: q
          in: query
          required: true
          schema: {type: string, minLength: 1}
        - name: sessionToken
          in: query
          required: false
          schema: {type: string}
      responses:
        "200":
          description: Address suggestions from Google Places
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaceAutocompleteResults"
        "503":
          description: Google Places lookup is not configured
  /places/details:
    get:
      operationId: getPlaceAddress
      tags: [places]
      parameters:
        - name: placeId
          in: query
          required: true
          schema: {type: string, minLength: 1}
        - name: sessionToken
          in: query
          required: false
          schema: {type: string}
      responses:
        "200":
          description: Full address for a Google place
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaceAddress"
        "404":
          description: Place not found
        "503":
          description: Google Places lookup is not configured
  /clients/{id}:
    get:
      operationId: getClient
      tags: [clients]
      parameters:
        - {$ref: "#/components/parameters/Id"}
      responses:
        "200":
          description: Client detail
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ClientDetail"}
    patch:
      operationId: updateClient
      tags: [clients]
      parameters:
        - {$ref: "#/components/parameters/Id"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UpdateClientInfoBody"}
      responses:
        "200":
          description: Updated client
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ClientDetail"}
  /clients/{id}/onboarding/{key}:
    patch:
      operationId: updateClientOnboardingItem
      tags: [clients]
      parameters:
        - {$ref: "#/components/parameters/Id"}
        - {name: key, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/OnboardingItemUpdate"}
      responses:
        "200":
          description: Updated onboarding summary
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OnboardingSummary"}
  /portal/onboarding:
    get:
      operationId: getPortalOnboarding
      tags: [portal]
      responses:
        "200":
          description: Client onboarding summary
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OnboardingSummary"}
  /portal/onboarding/{key}:
    patch:
      operationId: updatePortalOnboardingItem
      tags: [portal]
      parameters:
        - {name: key, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/OnboardingItemUpdate"}
      responses:
        "200":
          description: Updated onboarding summary
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OnboardingSummary"}
  /cases:
    get:
      operationId: listCases
      tags: [cases]
      parameters:
        - name: archived
          in: query
          required: false
          schema: {type: boolean}
          description: When true, return only archived cases. Defaults to active (non-archived) cases.
      responses:
        "200":
          description: Cases
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Case"}
    post:
      operationId: createCase
      tags: [cases]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CaseInput"}
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Case"}
  /cases/{id}:
    get:
      operationId: getCase
      tags: [cases]
      parameters:
        - {$ref: "#/components/parameters/Id"}
      responses:
        "200":
          description: Case detail
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CaseDetail"}
    patch:
      operationId: updateCase
      tags: [cases]
      parameters:
        - {$ref: "#/components/parameters/Id"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CaseUpdate"}
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Case"}
  /cases/{id}/submissions:
    post:
      operationId: createCaseSubmission
      tags: [cases]
      description: Submit the case to another lender. The first submission on a case becomes primary.
      parameters: [{$ref: "#/components/parameters/Id"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CaseSubmissionInput"}
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CaseSubmission"}
        "409":
          description: Already submitted to this lender
  /cases/{id}/submissions/{submissionId}:
    patch:
      operationId: updateCaseSubmission
      tags: [cases]
      parameters:
        - {$ref: "#/components/parameters/Id"}
        - name: submissionId
          in: path
          required: true
          schema: {type: integer}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CaseSubmissionUpdate"}
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CaseSubmission"}
    delete:
      operationId: deleteCaseSubmission
      tags: [cases]
      description: Remove a submission that has nothing recorded against it yet. Use PATCH status=withdrawn otherwise.
      parameters:
        - {$ref: "#/components/parameters/Id"}
        - name: submissionId
          in: path
          required: true
          schema: {type: integer}
      responses:
        "204": {description: Deleted}
        "409": {description: Submission has tracking recorded; withdraw it instead}
  /cases/{id}/stress-test:
    get:
      operationId: getCaseStressTest
      tags: [cases]
      parameters:
        - {$ref: "#/components/parameters/Id"}
      responses:
        "200":
          description: Stress test attached to the case (created on first access)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CaseStressTest"}
    patch:
      operationId: updateCaseStressTest
      tags: [cases]
      parameters:
        - {$ref: "#/components/parameters/Id"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UpdateCaseStressTestInput"}
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CaseStressTest"}
  /cases/{id}/stress-test/apply-property-value:
    post:
      operationId: applyCaseStressTestPropertyValue
      tags: [cases]
      parameters:
        - {$ref: "#/components/parameters/Id"}
      responses:
        "200":
          description: Updated case with the stress-test property value applied
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Case"}
        "409":
          description: The saved stress test does not pass
  /cases/{id}/lender-offer:
    get:
      operationId: getCaseLenderOfferReview
      tags: [cases]
      parameters:
        - {$ref: "#/components/parameters/Id"}
      responses:
        "200":
          description: Lender offer review state
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LenderOfferReviewResponse"}
    post:
      operationId: reviewCaseLenderOffer
      tags: [cases]
      parameters:
        - {$ref: "#/components/parameters/Id"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/LenderOfferReviewInput"}
      responses:
        "200":
          description: Lender offer review result
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LenderOfferReviewResponse"}
        "400":
          description: Invalid offer review
        "404":
          description: Case or offer document not found
  /cases/{id}/lender-offer/extract:
    post:
      operationId: extractCaseLenderOfferDetails
      tags: [cases]
      parameters:
        - {$ref: "#/components/parameters/Id"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/LenderOfferExtractionInput"}
      responses:
        "200":
          description: Details extracted from the lender offer document
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LenderOfferExtractionResponse"}
        "404":
          description: Case or lender offer document not found
        "503":
          description: OpenRouter extraction is not configured
  /cases/{id}/completion/prepare:
    post:
      operationId: prepareCaseCompletion
      tags: [cases]
      parameters:
        - {$ref: "#/components/parameters/Id"}
      responses:
        "200":
          description: Lender offer summary and completion values prepared for review
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CompletionPreparationResponse"}
