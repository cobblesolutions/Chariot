components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: {type: integer}
    ThreadKind:
      name: kind
      in: path
      required: true
      schema: {type: string, enum: [case, conversation]}
  schemas:
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: {type: string, format: email}
        password: {type: string, minLength: 8, maxLength: 200}
    PortalActivationInput:
      type: object
      required: [token, password]
      properties:
        token: {type: string, minLength: 32, maxLength: 200}
        password: {type: string, minLength: 8, maxLength: 200}
    ForgotPasswordInput:
      type: object
      required: [email]
      properties:
        email: {type: string, format: email}
    ResetPasswordInput:
      type: object
      required: [token, password]
      properties:
        token: {type: string, minLength: 32, maxLength: 200}
        password: {type: string, minLength: 8, maxLength: 200}
    ChangePasswordInput:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: {type: string, minLength: 8, maxLength: 200}
        newPassword: {type: string, minLength: 8, maxLength: 200}
    AuthUser:
      type: object
      required: [id, displayName, email, role, mustChangePassword]
      properties:
        id: {type: integer}
        displayName: {type: string}
        email: {type: string, format: email}
        role: {type: string, enum: [broker_ceo, case_manager, completions_manager, adviser, client]}
        mustChangePassword: {type: boolean}
    StaffUser:
      type: object
      required: [id, displayName, email, role]
      properties:
        id: {type: integer}
        displayName: {type: string}
        email: {type: string, format: email}
        role: {type: string, enum: [broker_ceo, case_manager, completions_manager, adviser]}
    StaffProfile:
      description: Public-safe staff directory entry used by the PIN-login profile picker. No email or other sensitive data.
      type: object
      required: [id, displayName, role]
      properties:
        id: {type: integer}
        displayName: {type: string}
        role: {type: string, enum: [broker_ceo, case_manager, completions_manager, adviser]}
    PinLoginInput:
      type: object
      required: [userId, pin]
      properties:
        userId: {type: integer}
        pin: {type: string, minLength: 4, maxLength: 8}
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: {type: string}
    Dashboard:
      type: object
      required: [activeCases, urgentTasks, awaitingClient, awaitingAcceptance, completionsThisMonth, pipelineValue, totalProcFee, totalBrokerFee, totalRevenue, stageCounts, recentActivity]
      properties:
        activeCases: {type: integer}
        awaitingAcceptance: {type: integer, description: Enquiries waiting to be accepted or declined.}
        urgentTasks: {type: integer}
        awaitingClient: {type: integer}
        completionsThisMonth: {type: integer}
        pipelineValue: {type: number}
        totalProcFee: {type: number}
        totalBrokerFee: {type: number}
        totalRevenue: {type: number}
        stageCounts:
          type: array
          items: {$ref: "#/components/schemas/StageCount"}
        recentActivity:
          type: array
          items: {$ref: "#/components/schemas/Activity"}
    StageCount:
      type: object
      required: [stage, count]
      properties:
        stage: {type: string}
        count: {type: integer}
    Activity:
      type: object
      required: [id, title, detail, actorName, occurredAt]
      properties:
        id: {type: integer}
        title: {type: string}
        detail: {type: string}
        actorName: {type: string}
        occurredAt: {type: string, format: date-time}
    ActivityListItem:
      type: object
      required: [id, title, detail, actorName, occurredAt, caseId, caseReference]
      properties:
        id: {type: integer}
        title: {type: string}
        detail: {type: string}
        actorName: {type: string}
        occurredAt: {type: string, format: date-time}
        caseId: {type: integer, nullable: true}
        caseReference: {type: string, nullable: true}
        entityType:
          type: string
          nullable: true
          enum: [client, property, invoice, renewal, document]
          description: The record this activity is about, when it is not (only) a case.
        entityId: {type: integer, nullable: true}
    ActivityPage:
      type: object
      required: [items, page, pageSize, total, hasMore]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/ActivityListItem"}
        page: {type: integer}
        pageSize: {type: integer}
        total: {type: integer}
        hasMore: {type: boolean}
    ClientLifecycle:
      type: string
      enum: [enquiry, onboarding, active, declined, lost]
    ClientSource:
      type: string
      enum: [email, phone, website, referral, introducer, existing_client, other]
    EnquiryType:
      type: string
      enum: [purchase, remortgage, refinance, bridging, development, commercial, other]
    ClientAssignee:
      type: object
      required: [id, displayName]
      properties:
        id: {type: integer}
        displayName: {type: string}
    WelcomeDelivery:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [pending, sent, disabled, failed]}
        error: {type: string, nullable: true}
        deliveredAt: {type: string, format: date-time, nullable: true}
    Client:
      type: object
      required: [id, name, email, phone, companyName, onboardingStatus, createdAt, lifecycle, stale, enquiryReceivedAt, openCases, loanTotal, openTasks, termsOfBusiness, onboardingCompletedAt]
      properties:
        id: {type: integer}
        name: {type: string}
        email: {type: string}
        phone: {type: string}
        companyName: {type: string}
        onboardingStatus: {type: string, enum: [not_started, in_progress, complete]}
        createdAt: {type: string, format: date-time}
        lifecycle: {$ref: "#/components/schemas/ClientLifecycle"}
        source: {type: string, enum: [email, phone, website, referral, introducer, existing_client, other], nullable: true}
        introducerName: {type: string, nullable: true}
        introducerContact: {type: string, nullable: true}
        assignee:
          allOf: [{$ref: "#/components/schemas/ClientAssignee"}]
          nullable: true
        enquiryType: {type: string, enum: [purchase, remortgage, refinance, bridging, development, commercial, other], nullable: true}
        enquirySummary: {type: string, nullable: true}
        enquiryTimescale: {type: string, nullable: true}
        enquiryEmailText: {type: string, nullable: true}
        enquiryEmailSubject: {type: string, nullable: true}
        enquiryEmailFrom: {type: string, nullable: true}
        enquiryReceivedAt: {type: string, format: date-time}
        acceptedAt: {type: string, format: date-time, nullable: true}
        closedAt: {type: string, format: date-time, nullable: true}
        outcomeReason: {type: string, nullable: true}
        stale:
          type: boolean
          description: True for an enquiry that has waited for acceptance longer than the stale threshold.
        welcomeDelivery:
          allOf: [{$ref: "#/components/schemas/WelcomeDelivery"}]
          nullable: true
        termsOfBusiness:
          allOf: [{$ref: "#/components/schemas/TermsAcceptance"}]
          nullable: true
        onboardingCompletedAt: {type: string, format: date-time, nullable: true}
        openCases: {type: integer, description: Cases that are not completed or archived.}
        loanTotal: {type: number, description: Sum of loan amounts across open cases.}
